[package]
name = "vault"
version = "0.1.0"
description = "TSLAx Yield Vault: single-asset vault routing TSLAx into Kamino Lend (devnet)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
crypto-common = "0.1.7"
pyth-solana-receiver-sdk = "0.1"